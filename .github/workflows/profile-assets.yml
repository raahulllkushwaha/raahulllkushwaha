name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1) Contribution Snake
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: raahulllkushwaha
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Snake action runs in a Docker container as root, which leaves
      # dist/ owned by root. Fix ownership so later steps can write into it.
      - name: Fix dist permissions
        run: sudo chown -R $(id -u):$(id -g) dist && chmod -R u+rwX dist

      # 2) GitHub Profile Trophy
      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: raahulllkushwaha
          file: dist/trophy.svg
          theme: tokyonight
          margin-width: "10"
          no-background: "true"
          token: ${{ secrets.TROPHY_TOKEN }}

      # 3) Activity Graph
      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: raahulllkushwaha
          options: theme=tokyo-night&hide_border=true&area=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      # Push everything to the "output" branch
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
